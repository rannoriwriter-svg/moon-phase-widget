<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astrology Dashboard</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
  }

  body {
    padding: 8px;
    font-family: "Courier New", Courier, monospace;
    color: #f2f2f2;
  }

  .dashboard {
    width: 100%;
    max-width: 760px;
    min-width: 280px;
    background: #202020;
    border-radius: 24px;
    padding: 32px;
    box-shadow: 0 10px 30px rgba(0,0,0,.12);
  }

  .frame {
    border: 2px solid #eeeeee;
  }

  .title {
    padding: 20px 26px;
    font-size: clamp(15px, 2.2vw, 22px);
    font-weight: 700;
    letter-spacing: .03em;
  }

  .moon-section {
    padding: 24px 26px 28px;
    border-bottom: 2px solid #eeeeee;
  }

  .moon-title {
    font-size: clamp(14px, 2vw, 20px);
    margin-bottom: 18px;
  }

  .moon-data {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    font-size: clamp(14px, 2vw, 19px);
  }

  .phase-name {
    font-weight: 700;
  }

  .illumination {
    font-weight: 700;
    white-space: nowrap;
  }

  .date {
    margin-top: 12px;
    font-size: 12px;
    opacity: .7;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }

  .cell {
    min-height: 92px;
    padding: 16px 18px;
  }

  .cell:nth-child(odd) {
    border-right: 2px solid #eeeeee;
  }

  .cell:nth-child(-n+2) {
    border-bottom: 2px solid #eeeeee;
  }

  .label {
    font-size: clamp(13px, 1.8vw, 17px);
    font-weight: 700;
    margin-bottom: 12px;
  }

  .value {
    font-size: clamp(13px, 1.8vw, 17px);
  }

  .footer {
    padding: 12px 18px;
    border-top: 0;
    font-size: 10px;
    opacity: .55;
  }

  @media (max-width: 430px) {
    .dashboard { padding: 16px; }
    .title, .moon-section { padding-left: 18px; padding-right: 18px; }
    .cell { padding: 14px; }
  }
</style>
</head>

<body>
<div class="dashboard">
  <div class="frame">

    <div class="title">✦ ASTROLOGY&nbsp;&nbsp;DASHBOARD</div>

    <section class="moon-section">
      <div class="moon-title">🌙&nbsp; MOON PHASE</div>

      <div class="moon-data">
        <span class="phase-name" id="phase">Loading...</span>
        <span class="illumination" id="illumination">--%</span>
      </div>

      <div class="date" id="date">Bangkok • Loading...</div>
    </section>

    <div class="grid">
      <div class="cell">
        <div class="label">☼ Sun</div>
        <div class="value">Capricorn</div>
      </div>

      <div class="cell">
        <div class="label">☽ Moon</div>
        <div class="value" id="moonSign">Calculating...</div>
      </div>

      <div class="cell">
        <div class="label">✦ Current Phase</div>
        <div class="value" id="phase2">Loading...</div>
      </div>

      <div class="cell">
        <div class="label">♀ Venus</div>
        <div class="value">Capricorn</div>
      </div>
    </div>

    <div class="footer">
      Lunar phase calculated for Bangkok (UTC+7) • Updated automatically
    </div>

  </div>
</div>

<script>
/*
  Approximate lunar phase calculation.
  Reference: New Moon 2000-01-06 18:14 UTC.
  Used for the dashboard display; it does not require an API.
*/
const SYNODIC_MONTH = 29.530588853;
const REF = Date.UTC(2000, 0, 6, 18, 14, 0);

function getLunarData(date) {
  const days = (date.getTime() - REF) / 86400000;
  let age = days % SYNODIC_MONTH;
  if (age < 0) age += SYNODIC_MONTH;

  const phase = age / SYNODIC_MONTH;
  const illumination = (1 - Math.cos(2 * Math.PI * phase)) / 2;

  let name;
  if (age < 1.84566) name = "New Moon";
  else if (age < 5.53699) name = "Waxing Crescent";
  else if (age < 9.22831) name = "First Quarter";
  else if (age < 12.91963) name = "Waxing Gibbous";
  else if (age < 16.61096) name = "Full Moon";
  else if (age < 20.30228) name = "Waning Gibbous";
  else if (age < 23.99361) name = "Last Quarter";
  else if (age < 27.68493) name = "Waning Crescent";
  else name = "New Moon";

  return { age, phase, illumination, name };
}

/* Approximate ecliptic longitude -> zodiac sign.
   This is intentionally labeled approximate because precise Moon
   sign needs an ephemeris/astronomical library. */
function approximateMoonSign(date) {
  const data = getLunarData(date);

  // Approximate lunar longitude using a simple synodic progression.
  // Seed chosen near the current 2026 ephemeris region.
  const daysFromJ2000 = (date.getTime() - Date.UTC(2000,0,1,12,0,0)) / 86400000;
  const longitude = (218.316 + 13.1763966 * daysFromJ2000) % 360;
  const signs = [
    "Aries","Taurus","Gemini","Cancer","Leo","Virgo",
    "Libra","Scorpio","Sagittarius","Capricorn","Aquarius","Pisces"
  ];
  return signs[Math.floor(((longitude + 360) % 360) / 30)];
}

function update() {
  const now = new Date();
  const data = getLunarData(now);

  document.getElementById("phase").textContent = data.name;
  document.getElementById("phase2").textContent = data.name;
  document.getElementById("illumination").textContent =
    Math.round(data.illumination * 100) + "%";

  document.getElementById("date").textContent =
    "Bangkok • " +
    new Intl.DateTimeFormat("en-GB", {
      timeZone: "Asia/Bangkok",
      weekday: "short",
      day: "2-digit",
      month: "short",
      year: "numeric",
      hour: "2-digit",
      minute: "2-digit",
      hour12: false
    }).format(now);

  document.getElementById("moonSign").textContent =
    approximateMoonSign(now);
}

update();
setInterval(update, 60000);
</script>
</body>
</html>
